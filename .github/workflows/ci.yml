name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ccognitions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run production build
        run: npm run build

      - name: Build production image on GitHub
        run: docker build -t ccognitions-web:${{ github.sha }} .

      - name: Export production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save ccognitions-web:${{ github.sha }} | gzip -1 > ccognitions-image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-image
          path: ccognitions-image.tar.gz
          retention-days: 2

  # Job 2: Deploy (solo en push a main, NO en PRs)
  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-image

      - name: Transfer built image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          source: ccognitions-image.tar.gz
          target: /opt/ccognitions/incoming/${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            echo "=== CCOGNITIONS DEPLOYMENT ==="
            echo "Commit: ${{ github.sha }}"

            cd /opt/ccognitions

            # Preserve host configuration and every other service, including the game.
            exec 9>/opt/ccognitions/web-deploy.lock
            flock -n 9
            previous=$(docker inspect ccognitions-web-prod --format '{{.Image}}')
            docker load -i incoming/${{ github.sha }}/ccognitions-image.tar.gz
            docker tag ccognitions-web:${{ github.sha }} ccognitions-web:latest
            rollback() {
              docker tag "$previous" ccognitions-web:latest
              docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --no-deps web
            }
            trap rollback ERR
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --no-deps web
            healthy=false
            for attempt in $(seq 1 30); do
              if docker exec ccognitions-web-prod wget -q -O /dev/null http://localhost:3000/api/health; then
                healthy=true
                break
              fi
              sleep 2
            done
            test "$healthy" = true
            trap - ERR
            # A changed web IP requires a graceful proxy reload; existing game sockets remain open.
            docker exec ccognitions-nginx-prod nginx -t
            docker exec ccognitions-nginx-prod nginx -s reload
            echo "=== DEPLOYMENT SUCCESSFUL ==="
